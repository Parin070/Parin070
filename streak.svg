<svg width="200" height="150" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('data:font/woff2;charset=utf-8;base64,') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    .text {
      font-family: 'JetBrains Mono', monospace;
      fill: #c9d1d9;
    }
    .accent {
      fill: #58a6ff;
    }
    
    @media (prefers-color-scheme: light) {
        .text { fill: #24292e; }
        .accent { fill: #0969da; }
    }
  </style>
  <text x="100" y="50" font-size="14" class="text" text-anchor="middle">Current Streak</text>
  <text x="100" y="90" font-size="32" class="accent" text-anchor="middle" font-weight="bold">42</text>
  <text x="100" y="120" font-size="12" class="text" text-anchor="middle" opacity="0.7">days</text>
</svg>